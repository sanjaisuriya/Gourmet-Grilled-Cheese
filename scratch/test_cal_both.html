<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { background: #12100E; color: #FAF7F2; padding: 40px; font-family: sans-serif; }
    .test-box { background: #24201D; padding: 25px; border-radius: 12px; max-width: 400px; margin-bottom: 20px; }
    
    /* Test 1: color-scheme: dark ONLY */
    .t1 input[type="date"] {
      color-scheme: dark;
    }
    .t1 input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
    }

    /* Test 2: BOTH color-scheme: dark AND filter: invert(1) */
    .t2 input[type="date"] {
      color-scheme: dark;
    }
    .t2 input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body>
  <div class="test-box t1">
    <h3>Test 1: color-scheme: dark ONLY</h3>
    <input type="date" class="form-control" value="2026-10-24">
  </div>

  <div class="test-box t2">
    <h3>Test 2: BOTH color-scheme: dark AND filter: invert(1)</h3>
    <input type="date" class="form-control" value="2026-10-24">
  </div>
</body>
</html>
