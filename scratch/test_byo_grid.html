<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../assets/css/style.css?v=5.2">
  <style>
    body {
      background: #FFF8EB;
      padding: 30px;
      font-family: 'Poppins', sans-serif;
    }
    .container-box {
      max-width: 600px;
      background: #FFFFFF;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    
    /* 2-COLUMN GRID ALIGNMENT */
    .byo-option-group {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 0.75rem !important;
    }
    .byo-chip {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      min-height: 44px !important;
      padding: 0.5rem 0.85rem !important;
      font-size: 0.88rem !important;
    }
  </style>
</head>
<body>
  <div class="container-box">
<div class="byo-controls">
              
              <!-- Step 1: Artisan Bread -->
              <div class="byo-step">
                <h3 class="byo-step-title">
                  <span>🍞 Step 1: Select Your Artisan Bread (Base Included)</span>
                </h3>
                <div class="byo-option-group" id="byo-bread-group">
                  <button type="button" class="byo-chip selected" data-type="bread" data-name="36-Hour Sourdough" data-price="0">
                    36-Hr Levain Sourdough (Classic +₹0)
                  </button>
                  <button type="button" class="byo-chip" data-type="bread" data-name="Garlic Butter Brioche" data-price="25">
                    Garlic Butter Brioche (+₹25)
                  </button>
                  <button type="button" class="byo-chip" data-type="bread" data-name="Thick Texas Sourdough" data-price="15">
                    Thick Texas Sourdough (+₹15)
                  </button>
                  <button type="button" class="byo-chip" data-type="bread" data-name="Rustic French Batard" data-price="30">
                    Rustic French Batard (+₹30)
                  </button>
                </div>
              </div>

              <!-- Step 2: Cheeses (Pick up to 2) -->
              <div class="byo-step">
                <h3 class="byo-step-title">
                  <span>🧀 Step 2: Choose Any 2 Cheeses (Base ₹180)</span>
                </h3>
                <div class="byo-option-group" id="byo-cheese-group">
                  <button type="button" class="byo-chip selected" data-type="cheese" data-name="Sharp White Cheddar" data-price="0">
                    Sharp White Cheddar (+₹0)
                  </button>
                  <button type="button" class="byo-chip selected" data-type="cheese" data-name="Wisconsin Mozzarella" data-price="0">
                    Wisconsin Mozzarella (+₹0)
                  </button>
                  <button type="button" class="byo-chip" data-type="cheese" data-name="Beechwood Smoked Gouda" data-price="30">
                    Smoked Dutch Gouda (+₹30)
                  </button>
                  <button type="button" class="byo-chip" data-type="cheese" data-name="Normandy French Brie" data-price="40">
                    Normandy French Brie (+₹40)
                  </button>
                  <button type="button" class="byo-chip" data-type="cheese" data-name="Spicy Pepper Jack" data-price="25">
                    Spicy Pepper Jack (+₹25)
                  </button>
                  <button type="button" class="byo-chip" data-type="cheese" data-name="Alps Mountain Fontina" data-price="35">
                    Alps Mountain Fontina (+₹35)
                  </button>
                </div>
              </div>

              <!-- Step 3: Gourmet Add-Ons -->
              <div class="byo-step">
                <h3 class="byo-step-title">
                  <span>🥓 Step 3: Gourmet Add-Ons (Select Any)</span>
                </h3>
                <div class="byo-option-group" id="byo-addons-group">
                  <button type="button" class="byo-chip selected" data-type="addon" data-name="Balsamic Caramelized Onions" data-price="40">
                    Caramelized Onion Jam (+₹40)
                  </button>
                  <button type="button" class="byo-chip" data-type="addon" data-name="Fire-Roasted Jalapeños" data-price="30">
                    Roasted Jalapeños (+₹30)
                  </button>
                  <button type="button" class="byo-chip" data-type="addon" data-name="Italian Truffle Butter" data-price="60">
                    Truffle Butter Glaze (+₹60)
                  </button>
                  <button type="button" class="byo-chip" data-type="addon" data-name="Hickory Smoked Bacon" data-price="80">
                    Hickory Smoked Bacon (+₹80)
                  </button>
                  <button type="button" class="byo-chip" data-type="addon" data-name="14-Hour Braised Brisket" data-price="120">
                    14-Hr Braised Brisket (+₹120)
                  </button>
                </div>
              </div>

              <!-- Step 4: Dipping Sauce -->
              <div class="byo-step" style="margin-bottom:0;">
                <h3 class="byo-step-title">
                  <span>🍅 Step 4: Companion Dipping Cup</span>
                </h3>
                <div class="byo-option-group" id="byo-dip-group">
                  <button type="button" class="byo-chip selected" data-type="dip" data-name="San Marzano Tomato Bisque" data-price="50">
                    Tomato Bisque Shooter (+₹50)
                  </button>
                  <button type="button" class="byo-chip" data-type="dip" data-name="Chipotle Garlic Aioli" data-price="35">
                    Chipotle Garlic Aioli (+₹35)
                  </button>
                  <button type="button" class="byo-chip" data-type="dip" data-name="Habanero Hot Honey" data-price="45">
                    Chili Hot Honey Cup (+₹45)
                  </button>
                  <button type="button" class="byo-chip" data-type="dip" data-name="No Dipping Sauce" data-price="0">
                    No Dipping Sauce (₹0)
                  </button>
                </div>
              </div>

            </div>

            </div></div></body></html>
