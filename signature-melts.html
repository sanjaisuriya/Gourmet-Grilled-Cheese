<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signature Melts | Gourmet Grilled Cheese & Comfort Food Truck</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Poppins', 'sans-serif'],
            heading: ['Poppins', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            cream: {
              DEFAULT: '#FFF4DE',
              light: '#FFF9EE',
              dark: '#FCEFD4',
            },
            cheddar: {
              DEFAULT: '#FFBB35',
              hover: '#F2AD23',
              dark: '#B46B00',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    .animate-scaleUp { animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slideLeft { animation: slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slideUp { animation: slideUp 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-[#FFF4DE] text-neutral-900 min-h-screen selection:bg-[#FFBB35] selection:text-neutral-950 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- Lucide Icon SVG Components ---
    const IconArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    );
    const IconShoppingBag = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    );
    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    );
    const IconEye = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const IconFlame = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const IconSparkles = ({ className = "w-4 h-4" }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );

    // --- Product Data ---
    const SIGNATURE_MELTS = [
      {
        id: 'classic-cheddar-melt',
        name: 'Classic Cheddar Melt',
        price: 249,
        image: 'assets/images/signature-melt-1.jpg',
        imageAlt: 'Golden toasted sourdough topped with melted cheddar cheese and a sunny-side-up egg',
        badge: 'VEG',
        highlightBadge: '⭐ ICONIC FAVORITE',
        highlightBg: 'bg-[#FFF6D6]',
        highlightText: 'text-[#9A5B00]',
        highlightBorder: 'border-[#F0DC9B]',
        description: 'Sharp 18-month Wisconsin yellow and white cheddar melted between thick slices of golden, butter-brushed artisanal brioche toast.',
        details: {
          bread: 'Artisanal Brioche Toast (Butter-Brushed)',
          cheeses: 'Sharp 18-Month Wisconsin Yellow & White Cheddar',
          topping: 'Farm-Fresh Sunny-Side-Up Egg with cracked black pepper & sea salt',
          cookingTemp: '375°F Griddle Seared',
          suggestedDip: 'Fire-Roasted San Marzano Tomato Bisque'
        }
      },
      {
        id: 'three-cheese-deluxe',
        name: 'Three-Cheese Deluxe',
        price: 299,
        image: 'assets/images/signature-melt-2.jpg',
        imageAlt: 'Golden grilled sandwich triangles with visibly melted cheese, served on a white plate',
        badge: 'VEG',
        highlightBadge: '24-INCH PULL',
        highlightBg: 'bg-[#FFF6D6]',
        highlightText: 'text-[#9A5B00]',
        highlightBorder: 'border-[#F0DC9B]',
        description: 'An exquisite trio of nutty French Gruyère, aged sharp white cheddar, and whole-milk low-moisture mozzarella crisped inside garlic-herb sourdough.',
        details: {
          bread: 'Garlic-Herb Fermented Sourdough',
          cheeses: 'Nutty French Gruyère, Aged White Cheddar & Low-Moisture Mozzarella',
          topping: 'Parmesan Herb Butter Crust with molten 24-inch cheese stretch',
          cookingTemp: '375°F Cast-Iron Pressed',
          suggestedDip: 'Smoky Garlic Dip & Roasted Tomato Jam'
        }
      },
      {
        id: 'spicy-jalapeno-melt',
        name: 'Spicy Jalapeño Melt',
        price: 329,
        image: 'assets/images/signature-melt-3.jpg',
        imageAlt: 'Gourmet spicy grilled sandwich with roasted jalapeños, colorful fresh ingredients, and a rustic wooden serving board',
        badge: 'VEG',
        highlightBadge: '🌶️ SPICY POPPER',
        highlightBg: 'bg-[#FFECE5]',
        highlightText: 'text-[#C2410C]',
        highlightBorder: 'border-[#FDC7B4]',
        description: 'Fire-roasted charred jalapeños, molten pepper jack, whipped scallion cream cheese, and a crunchy crushed tortilla crust on country sourdough.',
        details: {
          bread: 'Crushed Tortilla-Crusted Country Sourdough',
          cheeses: 'Molten Pepper Jack & Whipped Scallion Cream Cheese',
          topping: 'Charred Fire-Roasted Jalapeño Slices, Fresh Cilantro & Lime Spritz',
          cookingTemp: '375°F Flat Top Seared',
          suggestedDip: 'Cooling Avocado Crema & Chipotle Mayo'
        }
      }
    ];

    function App() {
      const [cart, setCart] = useState({});
      const [recentlyAddedId, setRecentlyAddedId] = useState(null);
      const [activeModalItem, setActiveModalItem] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);

      const handleAddToCart = (item) => {
        setCart(prev => ({ ...prev, [item.id]: (prev[item.id] || 0) + 1 }));
        setRecentlyAddedId(item.id);
        setTimeout(() => setRecentlyAddedId(null), 1200);

        setToastMessage(`Added 1x ${item.name} to your order! 🧀`);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const updateQuantity = (itemId, delta) => {
        setCart(prev => {
          const count = (prev[itemId] || 0) + delta;
          if (count <= 0) {
            const next = { ...prev };
            delete next[itemId];
            return next;
          }
          return { ...prev, [itemId]: count };
        });
      };

      const totalCartCount = Object.values(cart).reduce((a, b) => a + b, 0);
      const totalCartPrice = Object.entries(cart).reduce((sum, [id, qty]) => {
        const item = SIGNATURE_MELTS.find(m => m.id === id);
        return sum + (item ? item.price * qty : 0);
      }, 0);

      return (
        <div className="min-h-screen py-12 md:py-20 px-4 sm:px-6 lg:px-8">
          <div className="max-w-7xl mx-auto">
            
            {/* Top Navigation Banner */}
            <div className="flex items-center justify-between pb-8 mb-8 border-b border-amber-900/10">
              <a href="index.html" className="flex items-center gap-2 group">
                <span className="text-2xl">🧀</span>
                <span className="text-xl font-black tracking-tight text-neutral-950 uppercase font-heading group-hover:text-[#B46B00] transition-colors">
                  Gourmet Grilled Cheese
                </span>
              </a>
              <div className="flex items-center gap-3">
                <a href="index.html" className="text-xs sm:text-sm font-semibold text-neutral-600 hover:text-neutral-950 px-3 py-1.5 rounded-lg hover:bg-white/60 transition-colors">
                  ← Back to Home
                </a>
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold bg-[#FFBB35] hover:bg-[#F2AD23] text-neutral-950 shadow-sm transition-all active:scale-95"
                >
                  <IconShoppingBag />
                  <span>Cart</span>
                  {totalCartCount > 0 && (
                    <span className="w-5 h-5 rounded-full bg-neutral-950 text-white text-[11px] flex items-center justify-center font-bold">
                      {totalCartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>

            {/* ================= HEADER SECTION ================= */}
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 lg:mb-14 gap-6">
              <div className="max-w-2xl">
                {/* Eyebrow Pill */}
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-[#FFE5DD] text-[#C2410C] mb-3">
                  <IconFlame />
                  <span>The Main Event</span>
                </div>

                {/* Main Bold Uppercase Heading */}
                <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-neutral-950 uppercase font-heading leading-tight">
                  SIGNATURE MELTS
                </h1>

                {/* Subtitle */}
                <p className="mt-3 text-base sm:text-lg text-neutral-600 font-medium leading-relaxed">
                  Handcrafted on our 375°F flat top with edge-to-edge buttered bread and molten centers.
                </p>
              </div>

              {/* Top Right Action Button */}
              <div className="flex items-center gap-3 self-start md:self-end">
                <a
                  href="menu.html"
                  className="inline-flex items-center gap-2 px-5 py-3 rounded-full text-sm font-bold text-neutral-900 bg-white/90 hover:bg-white border border-neutral-300 hover:border-neutral-950 shadow-sm transition-all duration-200 group active:scale-95"
                >
                  <span>Explore Complete Menu</span>
                  <span className="transition-transform duration-200 group-hover:translate-x-1">→</span>
                </a>
              </div>
            </div>

            {/* ================= 3-COLUMN PRODUCT GRID ================= */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">
              {SIGNATURE_MELTS.map((item) => {
                const isAdded = recentlyAddedId === item.id;
                const currentQty = cart[item.id] || 0;

                return (
                  <article
                    key={item.id}
                    className="group flex flex-col bg-white rounded-2xl overflow-hidden border border-amber-900/10 shadow-[0_4px_24px_rgba(40,25,10,0.06)] hover:shadow-[0_12px_36px_rgba(40,25,10,0.12)] transition-all duration-300 hover:-translate-y-1.5"
                  >
                    {/* Top Image Frame */}
                    <div className="relative aspect-[4/3] w-full overflow-hidden bg-neutral-100">
                      <img
                        src={item.image}
                        alt={item.imageAlt}
                        className="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
                        loading="lazy"
                      />

                      {/* Badges Overlaid on Image (Top-Left) */}
                      <div className="absolute top-3.5 left-3.5 flex items-center gap-2 flex-wrap z-10">
                        {/* VEG Badge */}
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-wide uppercase bg-[#E6F9F0] text-[#0D8249] border border-[#B3F0D2] shadow-sm">
                          <span className="w-2 h-2 rounded-full bg-[#0D8249] animate-pulse" />
                          {item.badge}
                        </span>

                        {/* Highlight Badge */}
                        <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-wide uppercase border shadow-sm ${item.highlightBg} ${item.highlightText} ${item.highlightBorder}`}>
                          {item.highlightBadge}
                        </span>
                      </div>
                    </div>

                    {/* Card Body */}
                    <div className="p-6 flex flex-col flex-1 justify-between">
                      <div>
                        {/* Title */}
                        <h2 className="text-xl sm:text-2xl font-extrabold text-neutral-900 tracking-tight font-heading group-hover:text-[#B46B00] transition-colors">
                          {item.name}
                        </h2>

                        {/* Description */}
                        <p className="mt-2.5 text-sm sm:text-base text-neutral-600 leading-relaxed font-normal">
                          {item.description}
                        </p>
                      </div>

                      {/* Bottom Actions & Aligned Price */}
                      <div className="mt-6 pt-5 border-t border-neutral-100 flex items-center justify-between gap-3">
                        <div className="flex flex-col">
                          <span className="text-[11px] uppercase font-bold tracking-wider text-neutral-400">Price</span>
                          <span className="text-2xl font-black text-neutral-950 tracking-tight">
                            ₹{item.price}
                          </span>
                        </div>

                        <div className="flex items-center gap-2">
                          {/* "View in Menu" Button */}
                          <button
                            onClick={() => setActiveModalItem(item)}
                            className="inline-flex items-center gap-1 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-neutral-700 bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 transition-colors active:scale-95"
                          >
                            <IconEye />
                            <span>View in Menu</span>
                          </button>

                          {/* "Add to Cart" Button */}
                          <button
                            onClick={() => handleAddToCart(item)}
                            className={`inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 shadow-sm active:scale-95 ${
                              isAdded
                                ? 'bg-emerald-600 text-white'
                                : 'bg-[#FFBB35] hover:bg-[#F2AD23] text-neutral-950 hover:shadow-md'
                            }`}
                          >
                            {isAdded ? (
                              <>
                                <IconCheck />
                                <span>Added!</span>
                              </>
                            ) : (
                              <>
                                <IconPlus />
                                <span>Add to Cart</span>
                                {currentQty > 0 && (
                                  <span className="ml-1 w-5 h-5 rounded-full bg-neutral-950 text-white text-xs flex items-center justify-center font-bold">
                                    {currentQty}
                                  </span>
                                )}
                              </>
                            )}
                          </button>
                        </div>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>

          </div>

          {/* Footer Note & Socials */}
          <footer className="mt-16 pt-8 text-center text-xs text-neutral-500 border-t border-amber-900/10 flex flex-col items-center gap-3">
            <div className="flex items-center gap-3">
              <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="w-8 h-8 rounded-full bg-neutral-200/80 hover:bg-[#F8B735] text-neutral-800 flex items-center justify-center transition-colors" aria-label="Instagram">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              </a>
              <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" className="w-8 h-8 rounded-full bg-neutral-200/80 hover:bg-[#F8B735] text-neutral-800 flex items-center justify-center transition-colors" aria-label="Facebook">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              </a>
              <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" className="w-8 h-8 rounded-full bg-neutral-200/80 hover:bg-[#F8B735] text-neutral-800 flex items-center justify-center transition-colors" aria-label="Twitter">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
              </a>
              <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" className="w-8 h-8 rounded-full bg-neutral-200/80 hover:bg-[#FF0000] hover:text-white text-neutral-800 flex items-center justify-center transition-colors" aria-label="YouTube">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"/></svg>
              </a>
            </div>
            <span>© 2026 The Melt District • Gourmet Grilled Cheese & Comfort Food Truck</span>
          </footer>

          {/* ================= QUICK VIEW MODAL ================= */}
          {activeModalItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-neutral-200 relative animate-scaleUp">
                <div className="relative h-60 w-full overflow-hidden bg-neutral-900">
                  <img
                    src={activeModalItem.image}
                    alt={activeModalItem.name}
                    className="w-full h-full object-cover"
                  />
                  <button
                    onClick={() => setActiveModalItem(null)}
                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/60 hover:bg-black text-white flex items-center justify-center transition-all"
                  >
                    <IconX />
                  </button>
                  <div className="absolute bottom-3 left-4 flex items-center gap-2">
                    <span className="px-3 py-1 rounded-full text-xs font-bold uppercase bg-[#E6F9F0] text-[#0D8249]">
                      {activeModalItem.badge}
                    </span>
                    <span className="px-3 py-1 rounded-full text-xs font-bold uppercase bg-white/95 text-neutral-900">
                      ₹{activeModalItem.price}
                    </span>
                  </div>
                </div>

                <div className="p-6">
                  <h3 className="text-2xl font-black text-neutral-950 font-heading">
                    {activeModalItem.name}
                  </h3>
                  <p className="mt-2 text-sm text-neutral-600 leading-relaxed">
                    {activeModalItem.description}
                  </p>

                  <div className="mt-4 p-4 rounded-2xl bg-[#FFF9EE] border border-[#F2DEB5] space-y-2 text-xs sm:text-sm">
                    <div>
                      <strong className="text-neutral-900">🍞 Artisanal Bread: </strong>
                      <span className="text-neutral-700">{activeModalItem.details.bread}</span>
                    </div>
                    <div>
                      <strong className="text-neutral-900">🧀 Molten Cheeses: </strong>
                      <span className="text-neutral-700">{activeModalItem.details.cheeses}</span>
                    </div>
                    <div>
                      <strong className="text-neutral-900">✨ Special Touch: </strong>
                      <span className="text-neutral-700">{activeModalItem.details.topping}</span>
                    </div>
                    <div>
                      <strong className="text-neutral-900">🥣 Best Paired With: </strong>
                      <span className="text-neutral-700">{activeModalItem.details.suggestedDip}</span>
                    </div>
                  </div>

                  <div className="mt-6 flex items-center justify-between gap-3">
                    <span className="text-2xl font-black text-neutral-950">₹{activeModalItem.price}</span>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setActiveModalItem(null)}
                        className="px-4 py-2.5 rounded-xl text-sm font-semibold text-neutral-700 hover:bg-neutral-100 transition-colors"
                      >
                        Close
                      </button>
                      <button
                        onClick={() => {
                          handleAddToCart(activeModalItem);
                          setActiveModalItem(null);
                        }}
                        className="px-5 py-2.5 rounded-xl text-sm font-bold text-neutral-950 bg-[#FFBB35] hover:bg-[#F2AD23] shadow-md transition-all active:scale-95 flex items-center gap-2"
                      >
                        <IconPlus />
                        <span>Add to Order</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= TOAST NOTIFICATION ================= */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-neutral-950 text-white shadow-2xl border border-neutral-800 animate-slideUp">
              <IconSparkles />
              <span className="text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          {/* ================= SLIDE-OUT CART DRAWER ================= */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col p-6 animate-slideLeft">
                <div className="flex items-center justify-between pb-4 border-b border-neutral-100">
                  <div className="flex items-center gap-2">
                    <IconShoppingBag className="w-5 h-5 text-[#B46B00]" />
                    <h3 className="text-xl font-extrabold text-neutral-900 font-heading">Your Melt Cart</h3>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#FFF4DE] text-neutral-900">
                      {totalCartCount}
                    </span>
                  </div>
                  <button
                    onClick={() => setIsCartOpen(false)}
                    className="w-8 h-8 rounded-full bg-neutral-100 hover:bg-neutral-200 flex items-center justify-center transition-colors"
                  >
                    <IconX />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-4 space-y-4">
                  {totalCartCount === 0 ? (
                    <div className="py-16 text-center text-neutral-400">
                      <p className="text-4xl mb-2">🧀</p>
                      <p className="font-semibold text-neutral-600">Your cart is empty</p>
                      <p className="text-xs mt-1">Add some hot gourmet melts from the menu!</p>
                    </div>
                  ) : (
                    Object.entries(cart).map(([itemId, qty]) => {
                      const item = SIGNATURE_MELTS.find(m => m.id === itemId);
                      if (!item) return null;
                      return (
                        <div key={itemId} className="flex items-center gap-3.5 p-3 rounded-2xl bg-neutral-50 border border-neutral-100">
                          <img src={item.image} alt={item.name} className="w-16 h-16 rounded-xl object-cover" />
                          <div className="flex-1">
                            <h4 className="text-sm font-bold text-neutral-900">{item.name}</h4>
                            <p className="text-xs text-neutral-500 font-medium">₹{item.price} each</p>
                            <div className="mt-2 flex items-center gap-2.5">
                              <button
                                onClick={() => updateQuantity(itemId, -1)}
                                className="w-6 h-6 rounded-md bg-white border border-neutral-300 flex items-center justify-center text-xs font-bold hover:bg-neutral-100"
                              >
                                -
                              </button>
                              <span className="text-xs font-bold text-neutral-900">{qty}</span>
                              <button
                                onClick={() => updateQuantity(itemId, 1)}
                                className="w-6 h-6 rounded-md bg-white border border-neutral-300 flex items-center justify-center text-xs font-bold hover:bg-neutral-100"
                              >
                                +
                              </button>
                            </div>
                          </div>
                          <div className="text-right">
                            <span className="text-sm font-extrabold text-neutral-900">₹{item.price * qty}</span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {totalCartCount > 0 && (
                  <div className="pt-4 border-t border-neutral-100 space-y-3">
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-neutral-500">Subtotal</span>
                      <span className="font-extrabold text-neutral-900 text-lg">₹{totalCartPrice}</span>
                    </div>
                    <p className="text-xs text-neutral-400">Freshly griddled to order on truck arrival.</p>
                    <button
                      onClick={() => {
                        alert(`Thank you for ordering ₹${totalCartPrice} of Signature Melts! Live griddle order placed.`);
                        setIsCartOpen(false);
                      }}
                      className="w-full py-3.5 rounded-xl bg-[#FFBB35] hover:bg-[#F2AD23] text-neutral-950 font-extrabold text-sm shadow-md transition-all active:scale-98"
                    >
                      Proceed to Checkout (₹{totalCartPrice})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
